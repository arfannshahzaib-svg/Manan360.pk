*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f4f6f9;
    color:#333;
}

/* HEADER */

header{
    background:linear-gradient(135deg,#0b57d0,#003b99);
    color:white;
    text-align:center;
    padding:40px 20px;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

header h1{

}

header p{

}

/* CLASS TITLE */

.class-title{
    text-align:center;
    margin-top:50px;
    font-size:34px;
    color:#0b57d0;
}

/* CARD CONTAINER */

.container{
    display:flex;
    justify-content:center;
    gap:30px;
    flex-wrap:wrap;
    padding:40px 20px;
}

/* CARD */

.card{
    background:white;
    width:300px;
    border-radius:20px;
    padding:30px;
    text-align:center;
    box-shadow:0 6px 18px rgba(0,0,0,0.15);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-8px);
}

.card h2{
    color:#0b57d0;
    margin-bottom:15px;
    font-size:30px;
}

.card p{
    margin-bottom:20px;
    color:#666;
}

/* BUTTONS */

.btn{
    display:block;
    margin-top:12px;
    padding:14px;
    background:#0b57d0;
    color:white;
    text-decoration:none;
    border-radius:10px;
    font-size:16px;
    transition:0.3s;
}

.btn:hover{
    background:#003b99;
}

/* FOOTER */

footer{
    margin-top:50px;
    background:#111;
    color:white;
    text-align:center;
    padding:18px;
    font-size:15px;
}

</style>
</head>
