<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manan360 Login</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #111827, #2563eb);
}

.login-box {
  width: 90%;
  max-width: 380px;
  background: white;
  padding: 35px 25px;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 15px 40px rgba(0,0,0,.3);
}

.logo {
  font-size: 32px;
  font-weight: bold;
  color: #2563eb;
  margin-bottom: 10px;
}

h2 {
  margin-bottom: 25px;
}

input {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border: 1px solid #ccc;
  border-radius: 10px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: 0;
  border-radius: 10px;
  background: #2563eb;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

#error {
  color: red;
  margin-top: 15px;
}
</style>
</head>

<body>

<div class="login-box">
  <div class="logo">Manan360</div>
  <h2>Login</h2>

  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">

  <button onclick="login()">Login</button>

  <p id="error"></p>
</div>

<script>
function login() {

  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;

  if (username === "Manan360" && password === "1098765492") {

    sessionStorage.setItem("manan360Login", "true");

    window.location.href = "index.html";

  } else {

    document.getElementById("error").innerText =
      "Username یا Password غلط ہے!";

  }
}
</script>

</body>
</html><!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manan360</title>

  <script>
    window.location.replace("secure-login.html");
  </script>
</head>

<body>
  <p>Redirecting to Login...</p>
</body>
</html>
